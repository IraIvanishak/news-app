<div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">{{.Title}}</h1>
        <div class="text-gray-500 text-sm">
            Created: {{.CreatedAt.Format "2006-01-02 15:04"}}
            {{if ne .CreatedAt .UpdatedAt}}
                (Updated: {{.UpdatedAt.Format "2006-01-02 15:04"}})
            {{end}}
        </div>
    </div>

    <!-- Photo Display -->
    {{if .PhotoURL}}
    <div class="mb-6">
        <img src="{{.PhotoURL}}" alt="Article image" class="w-full max-h-96 object-cover rounded-lg shadow-md">
        <p class="text-xs text-gray-500 mt-2">
            Photo by
            <a href="{{.PhotographerURL}}" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-700">
                {{.PhotographerName}}
            </a>
            on
            <a href="https://unsplash.com?utm_source={{.UnsplashAppName}}&utm_medium=referral" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-700">
                Unsplash
            </a>
        </p>
    </div>
    {{end}}

    <div class="prose max-w-none mb-6">
        <p class="text-gray-700">{{.Content}}</p>
    </div>

    <div class="flex justify-between items-center">
        <div class="space-x-2">
             <button 
                 hx-get="/posts/{{.ID}}/edit"
                 hx-target="#content"
                 class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition-colors"
             >
                 Edit
             </button>
             <button 
                 hx-delete="/posts/{{.ID}}"
                 hx-confirm="Are you sure you want to delete this post?"
                 hx-target="#content"
                 hx-swap="innerHTML"
                 class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition-colors"
             >
                 Delete
             </button>
        </div>
         <button 
             hx-get="/posts"
             hx-target="#content"
             class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors"
         >
             Back to List
         </button>
    </div>
</div>
