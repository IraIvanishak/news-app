<div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-6 text-left">Edit Post</h2>

    {{if .Error}}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            {{.Error}}
        </div>
    {{end}}

    <form 
        hx-put="/posts/{{.ID.Hex}}"
        hx-target="#content"
        hx-swap="innerHTML"
        class="space-y-4"
    >
        <div>
            <label for="title" class="block text-gray-700 mb-2">Title</label>
             <input 
                 type="text" 
                 name="title" 
                 id="title" 
                 value="{{.Title}}"
                 required
                 minlength="3"
                 maxlength="200"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 placeholder="Enter post title"
             >
        </div>

        <div>
            <label for="content" class="block text-gray-700 mb-2">Content</label>
             <textarea 
                 name="content" 
                 id="content" 
                 required
                 minlength="10"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 placeholder="Write your post content"
                 rows="4"
             >{{.Content}}</textarea>
        </div>

         <div class="flex space-x-4">
             <button 
                 type="submit" 
                 class="flex-grow bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors"
             >
                 Update Post
             </button>
             <button 
                 type="button"
                 hx-get="/posts"
                 hx-target="#content"
                 class="flex-grow bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition-colors"
             >
                 Cancel
             </button>
         </div>
    </form>
</div>
