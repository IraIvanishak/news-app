<div class="create-post-form bg-white shadow-md rounded-lg p-6 max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Create New Post</h2>
    <form 
        hx-post="/posts"
        hx-target="#content"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.xhr.status !== 200) { alert('Error: ' + event.detail.xhr.responseText); }"
        class="space-y-4"
    >
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
            <input 
                type="text" 
                name="title" 
                id="title"
                placeholder="Enter post title" 
                required
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            >
        </div>
        <div>
            <label for="post-content" class="block text-sm font-medium text-gray-700">Content</label>
            <textarea 
                name="content" 
                id="post-content"
                placeholder="Enter post content" 
                required
                rows="4"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            ></textarea>
        </div>
        <div class="flex space-x-2">
            <button 
                type="submit" 
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
                Create Post
            </button>
            <button 
                type="button" 
                hx-get="/posts"
                hx-target="#content"
                hx-swap="innerHTML"
                class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
            >
                Cancel
            </button>
        </div>
    </form>
</div>
